name: Build Fitra APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6 @capacitor/assets@3

      - name: Build web app
        run: npm run build

      - name: Find web build folder
        run: |
          echo "--- top level ---"
          ls -la
          echo "--- dist ---"
          ls -la dist || echo "no dist folder"
          DIR=$(find . -mindepth 2 -name index.html -not -path "./node_modules/*" -not -path "./android/*" -not -path "./.git/*" -not -path "./public/*" | head -1 | xargs -r dirname)
          echo "Found web folder: $DIR"
          if [ -n "$DIR" ]; then
            sed -i "s#\"webDir\": \"dist\"#\"webDir\": \"$DIR\"#" capacitor.config.json
          fi
          cat capacitor.config.json

      - name: Add Android and generate icons
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Fitra-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Fitra v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
