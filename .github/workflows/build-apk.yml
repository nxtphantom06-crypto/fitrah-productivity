name: Build Fitra APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6 @capacitor/assets@3

      - name: Build web app
        run: npm run build
      - name: Show build output
        run: |
          ls -la dist || echo "no dist folder"
          find . -name index.html -not -path "./node_modules/*" -not -path "./android/*"
      - name: Add Android and generate icons
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Fitra-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
